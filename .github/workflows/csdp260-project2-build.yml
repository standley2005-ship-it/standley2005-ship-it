name: CSDP 260 Project 2 Windows executable + real GUI evidence
on:
  push:
    branches:
      - csdp260-project2-build
    paths:
      - '.github/workflows/csdp260-project2-build.yml'
      - 'csdp260-project2/**'
jobs:
  verify-windows-app:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Compile Windows x64 NASM calculator
        shell: pwsh
        run: |
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "VS 2022 C++ Build Tools not found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c ('call "'+$vcvars+'" && cd csdp260-project2 && call build.bat')
          if ($LASTEXITCODE -ne 0) { throw "NASM/link.exe build failed" }
          if (-not (Test-Path "csdp260-project2/build/Calculator.exe")) { throw "Calculator.exe missing" }
      - name: Launch real calculator, run GUI tests and capture evidence
        shell: pwsh
        continue-on-error: true
        run: |
          & ./csdp260-project2/windows_test.ps1
      - name: Upload Windows executable and genuine test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CSDP260-Project2-Windows-Evidence
          path: |
            csdp260-project2/build/Calculator.exe
            csdp260-project2/evidence/*.png
            csdp260-project2/evidence/*.csv
          if-no-files-found: warn
