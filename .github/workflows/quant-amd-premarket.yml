name: Quant AMD Premarket Backtest

on:
  push:
    branches: [quant-amd-backtest]
    paths:
      - 'quant-amd-backtest/amd_premarket.py'
      - '.github/workflows/quant-amd-premarket.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quant-amd-backtest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r quant-amd-backtest/requirements.txt
      - name: Download extended-hours QQQ 5-minute history
        run: |
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/lvrusu/QQQ_price_data/main/QQQ5m_Ext_J_19_to_Dec_26_2025.csv' \
            -o quant-amd-backtest/qqq5m_ext.csv
          ls -lh quant-amd-backtest/qqq5m_ext.csv
      - name: Optimize premarket AMD and open untouched 2025
        run: |
          cd quant-amd-backtest
          python amd_premarket.py qqq5m_ext.csv | tee premarket.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quant-amd-premarket-results
          path: |
            quant-amd-backtest/premarket_results/
            quant-amd-backtest/premarket.log
