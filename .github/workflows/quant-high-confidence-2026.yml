name: Quant High Confidence 2026
on:
  push:
    branches: [quant-amd-backtest]
    paths:
      - 'quant-amd-backtest/extension_eval.py'
      - '.github/workflows/quant-high-confidence-2026.yml'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quant-amd-backtest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r quant-amd-backtest/requirements.txt
      - name: Download QQQ one-minute data through Mar 26 2026
        run: |
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/lvrusu/QQQ_price_data/main/QQQ1m_Ext_J_26_to_Mar_26B_2026.csv' -o quant-amd-backtest/qqq1m_2026.csv
      - name: Test frozen ensemble on Mar 23-26 extension
        run: |
          cd quant-amd-backtest
          python extension_eval.py qqq1m_2026.csv | tee extension.log
      - uses: actions/upload-artifact@v4
        with:
          name: ensemble-extension-results
          path: quant-amd-backtest/extension.log