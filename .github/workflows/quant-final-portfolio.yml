name: Quant Final Portfolio
on:
  push:
    branches: [quant-amd-backtest]
    paths:
      - 'quant-amd-backtest/final_portfolio_eval.py'
      - '.github/workflows/quant-final-portfolio.yml'
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quant-amd-backtest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r quant-amd-backtest/requirements.txt
      - run: curl -L --fail --retry 3 'https://raw.githubusercontent.com/lvrusu/QQQ_price_data/main/QQQ5m_Ext_J_19_to_Dec_26_2025.csv' -o quant-amd-backtest/train.csv
      - run: curl -L --fail --retry 3 'https://raw.githubusercontent.com/lvrusu/QQQ_price_data/main/QQQ5m_Ext_J_23_to_Mar_20a_2026.csv' -o quant-amd-backtest/holdout2026.csv
      - name: Evaluate portfolio
        run: |
          cd quant-amd-backtest
          python final_portfolio_eval.py train.csv holdout2026.csv | tee final_portfolio.log
      - uses: actions/upload-artifact@v4
        with:
          name: final-portfolio-results
          path: |
            quant-amd-backtest/final_portfolio_results/
            quant-amd-backtest/final_portfolio.log
